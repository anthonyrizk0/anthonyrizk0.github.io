<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test – Ask</title>
        <link rel="icon" type="image/png" href="/anthonyrizk_favicon.png" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            :root {
                --bg: #0d0e1a; --bg-card: #141527;
                --border: rgba(122,162,247,0.1); --border-mid: rgba(122,162,247,0.2);
                --text: #c0caf5; --text-mid: #9aa5ce; --text-muted: #565f89;
                --blue: #7aa2f7; --teal: #73daca; --purple: #bb9af7;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: var(--bg); color: var(--text);
                min-height: 100vh; display: flex; align-items: center; justify-content: center;
                padding: 24px;
            }
            .card {
                width: 100%; max-width: 560px;
                background: var(--bg-card); border: 1px solid var(--border);
                border-radius: 14px; padding: 32px;
                box-shadow: 0 24px 48px rgba(0,0,0,0.4);
            }
            h1 {
                font-family: "Space Grotesk", sans-serif;
                font-size: 1.4rem; font-weight: 600; margin-bottom: 4px;
                background: linear-gradient(135deg, var(--blue), var(--purple));
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            }
            .sub { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 24px; }
            label { font-size: 0.78rem; color: var(--text-mid); display: block; margin-bottom: 6px; }
            textarea {
                width: 100%; min-height: 90px; resize: vertical;
                background: var(--bg); color: var(--text); border: 1px solid var(--border-mid);
                border-radius: 8px; padding: 12px; font-family: inherit; font-size: 0.9rem;
                outline: none; transition: border-color 0.2s;
            }
            textarea:focus { border-color: var(--blue); }
            .row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
            button {
                padding: 10px 28px; border-radius: 8px;
                font-family: inherit; font-size: 0.82rem; font-weight: 500;
                background: linear-gradient(135deg, rgba(122,162,247,0.18), rgba(187,154,247,0.18));
                border: 1px solid var(--border-mid); color: var(--blue); cursor: pointer;
                transition: all 0.2s;
            }
            button:hover:not(:disabled) { border-color: var(--blue); background: rgba(122,162,247,0.28); }
            button:disabled { opacity: 0.5; cursor: not-allowed; }
            #stop { color: #f77; display: none; }
            #status { font-size: 0.75rem; color: var(--text-muted); margin-left: auto; }
            #answer {
                margin-top: 16px; padding: 14px; border-radius: 8px;
                background: rgba(115,218,202,0.06); border: 1px solid rgba(115,218,202,0.18);
                font-size: 0.88rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
                display: none;
            }
            #answer.streaming { border-color: var(--teal); }
            #answer.err {
                background: rgba(255,100,100,0.08); border-color: rgba(255,100,100,0.25); color: #f77;
            }
            details { margin-top: 16px; font-size: 0.75rem; color: var(--text-muted); }
            summary { cursor: pointer; }
            #frames {
                margin-top: 8px; max-height: 180px; overflow: auto;
                background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
                padding: 10px; font-family: ui-monospace, monospace; font-size: 0.72rem;
                white-space: pre-wrap; word-break: break-all;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Ask Test</h1>
            <p class="sub">Streams SSE from ask.anthonyrizk.me — dev harness for the /ask endpoint.</p>

            <label for="q">Question</label>
            <textarea id="q" placeholder="Type a question…"></textarea>

            <!-- Rendered explicitly from JS so we can keep the widget id and
                 reset it between questions. Turnstile tokens are single-use:
                 without a reset, only the first question would verify. -->
            <div id="turnstile"></div>

            <div class="row">
                <button id="btn">Send</button>
                <button id="stop">Stop</button>
                <span id="status"></span>
            </div>

            <div id="answer"></div>

            <details>
                <summary>Raw SSE frames</summary>
                <div id="frames"></div>
            </details>
        </div>

        <!-- Turnstile bootstrap MUST come before api.js loads. The script is
             async, so if the callback isn't already on window when it runs,
             it never fires and window.turnstile stays uninitialised. -->
        <script>
            const SITEKEY = "0x4AAAAAAEnfXIBT6gmKFYih"; // public by design

            // A token is redeemed exactly once at siteverify, so each question
            // needs a fresh one. Render explicitly, keep the widget id, reset
            // after every attempt.
            let widgetId = null;

            window.onTurnstileLoad = function () {
                widgetId = window.turnstile.render("#turnstile", {
                    sitekey: SITEKEY,
                    action: "ask", // server checks this matches
                });
            };
        </script>
        <script
            src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit"
            async
            defer
        ></script>
        <script>
            const ENDPOINT = "https://ask.anthonyrizk.me/ask";

            /** Current token, or "" if the widget isn't ready / hasn't solved. */
            function turnstileToken() {
                if (widgetId === null || !window.turnstile) return "";
                return window.turnstile.getResponse(widgetId) || "";
            }

            function resetTurnstile() {
                if (widgetId !== null && window.turnstile) window.turnstile.reset(widgetId);
            }

            const q = document.getElementById("q");
            const btn = document.getElementById("btn");
            const stopBtn = document.getElementById("stop");
            const status = document.getElementById("status");
            const answer = document.getElementById("answer");
            const frames = document.getElementById("frames");

            let ac = null; // AbortController for the in-flight request, if any

            function setState(busy) {
                btn.disabled = busy;
                stopBtn.style.display = busy ? "" : "none";
                if (!busy) ac = null;
            }

            function fail(msg) {
                answer.className = "err";
                answer.style.display = "block";
                answer.textContent = msg;
                status.textContent = "";
            }

            async function send() {
                const question = q.value.trim();
                if (!question) { fail("Enter a question first."); return; }

                // Managed mode is usually invisible, but on a suspicious signal
                // it shows a challenge — until that's solved there's no token.
                if (!window.turnstile || widgetId === null) {
                    fail("Turnstile failed to load (blocked script, or challenges.cloudflare.com unreachable). Check the console.");
                    return;
                }
                const token = turnstileToken();
                if (!token) { fail("Verification still running — wait a moment, or complete the challenge above, then send."); return; }

                ac = new AbortController();
                setState(true);
                answer.className = "streaming";
                answer.style.display = "block";
                answer.textContent = "";
                frames.textContent = "";

                const t0 = performance.now();
                let chars = 0;
                status.textContent = "connecting…";

                try {
                    const res = await fetch(ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ question, turnstileToken: token }),
                        signal: ac.signal,
                    });

                    if (!res.ok || !res.body) {
                        fail(`[${res.status}] ${await res.text()}`);
                        return;
                    }

                    // Parse SSE: events are separated by blank lines; each
                    // event's payload is its "data:" line(s), JSON-encoded.
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buf = "";

                    for (;;) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buf += decoder.decode(value, { stream: true });

                        let idx;
                        while ((idx = buf.indexOf("\n\n")) !== -1) {
                            const raw = buf.slice(0, idx);
                            buf = buf.slice(idx + 2);
                            const data = raw.split("\n")
                                .filter((l) => l.startsWith("data:"))
                                .map((l) => l.slice(5).trimStart())
                                .join("\n");
                            if (!data) continue;

                            frames.textContent += data + "\n";
                            frames.scrollTop = frames.scrollHeight;

                            const msg = JSON.parse(data);
                            if (msg.error) { fail(msg.error); return; }
                            if (msg.text) {
                                answer.textContent += msg.text;
                                chars += msg.text.length;
                                status.textContent =
                                    `streaming… ${chars} chars, ${((performance.now() - t0) / 1000).toFixed(1)}s`;
                            }
                            if (msg.done) {
                                answer.className = "";
                                status.textContent =
                                    `done — ${chars} chars in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
                            }
                        }
                    }
                } catch (e) {
                    if (e.name === "AbortError") {
                        answer.className = "";
                        status.textContent = `stopped after ${((performance.now() - t0) / 1000).toFixed(1)}s (server stops billing here)`;
                    } else {
                        fail(`Error: ${e.message}`);
                    }
                } finally {
                    // The token is redeemed (or burnt) either way — get a fresh
                    // one so the next question can verify.
                    resetTurnstile();
                    setState(false);
                }
            }

            btn.addEventListener("click", send);
            stopBtn.addEventListener("click", () => ac?.abort());
            q.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
            });
        </script>
    </body>
</html>
