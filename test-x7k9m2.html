<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test – Ask</title>
        <link rel="icon" type="image/png" href="/anthonyrizk_favicon.png" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            :root {
                --bg: #0d0e1a; --bg-card: #141527;
                --border: rgba(122,162,247,0.1); --border-mid: rgba(122,162,247,0.2);
                --text: #c0caf5; --text-mid: #9aa5ce; --text-muted: #565f89;
                --blue: #7aa2f7; --teal: #73daca; --purple: #bb9af7;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: var(--bg); color: var(--text);
                min-height: 100vh; display: flex; align-items: center; justify-content: center;
                padding: 24px;
            }
            .card {
                width: 100%; max-width: 520px;
                background: var(--bg-card); border: 1px solid var(--border);
                border-radius: 14px; padding: 32px;
                box-shadow: 0 24px 48px rgba(0,0,0,0.4);
            }
            h1 {
                font-family: "Space Grotesk", sans-serif;
                font-size: 1.4rem; font-weight: 600; margin-bottom: 4px;
                background: linear-gradient(135deg, var(--blue), var(--purple));
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            }
            .sub { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 24px; }
            label { font-size: 0.78rem; color: var(--text-mid); display: block; margin-bottom: 6px; }
            textarea {
                width: 100%; min-height: 100px; resize: vertical;
                background: var(--bg); color: var(--text); border: 1px solid var(--border-mid);
                border-radius: 8px; padding: 12px; font-family: inherit; font-size: 0.9rem;
                outline: none; transition: border-color 0.2s;
            }
            textarea:focus { border-color: var(--blue); }
            button {
                margin-top: 16px; padding: 10px 28px; border-radius: 8px;
                font-family: inherit; font-size: 0.82rem; font-weight: 500;
                background: linear-gradient(135deg, rgba(122,162,247,0.18), rgba(187,154,247,0.18));
                border: 1px solid var(--border-mid); color: var(--blue); cursor: pointer;
                transition: all 0.2s;
            }
            button:hover { border-color: var(--blue); background: rgba(122,162,247,0.28); }
            button:disabled { opacity: 0.5; cursor: not-allowed; }
            #result {
                margin-top: 16px; padding: 12px; border-radius: 8px;
                font-size: 0.82rem; white-space: pre-wrap; word-break: break-word;
                display: none;
            }
            #result.ok { display: block; background: rgba(115,218,202,0.1); border: 1px solid rgba(115,218,202,0.25); color: var(--teal); }
            #result.err { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.25); color: #f77; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Ask Test</h1>
            <p class="sub">POSTs JSON to ask.anthonyrizk.me</p>

            <label for="q">Question</label>
            <textarea id="q" placeholder="Type a question…"></textarea>
            <button id="btn" onclick="send()">Send</button>
            <div id="result"></div>
        </div>

        <script>
            const ENDPOINT = "https://ask.anthonyrizk.me/ask";

            async function send() {
                const btn = document.getElementById("btn");
                const q = document.getElementById("q").value.trim();
                const out = document.getElementById("result");

                if (!q) { out.className = "err"; out.textContent = "Enter a question first."; return; }

                btn.disabled = true;
                out.className = ""; out.style.display = "none";

                try {
                    const res = await fetch(ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ question: q }),
                    });
                    const text = await res.text();
                    out.className = res.ok ? "ok" : "err";
                    out.textContent = `[${res.status}] ${text}`;
                } catch (e) {
                    out.className = "err";
                    out.textContent = `Error: ${e.message}`;
                } finally {
                    btn.disabled = false;
                }
            }

            document.getElementById("q").addEventListener("keydown", (e) => {
                if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
            });
        </script>
    </body>
</html>
