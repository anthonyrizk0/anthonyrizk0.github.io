<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Designed to survive being shrunk to a 160px thumbnail: two elements, both big,
     high contrast, nothing small that turns to mush. */
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: Inter, sans-serif;
    background:
      radial-gradient(ellipse 80% 70% at 50% 40%, rgba(122,162,247,.22), transparent 70%),
      #0d0e1a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  body::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 10px;
    background: linear-gradient(to right, #bb9af7, #7aa2f7 50%, #73daca);
  }
  h1 {
    font-family: "Space Grotesk", sans-serif; font-size: 168px; font-weight: 700;
    letter-spacing: -6px; line-height: 1;
    background: linear-gradient(135deg, #8fb3ff, #c7a6ff 55%, #7ff0dc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .ask {
    margin-top: 44px; display: inline-flex; align-items: center; gap: 20px;
    padding: 22px 44px; border-radius: 18px;
    font-size: 54px; font-weight: 600; color: #0d0e1a;
    background: #73daca;
  }
  .url { position: absolute; bottom: 30px; font-family: "JetBrains Mono", monospace; font-size: 30px; color: #7c83ad; }
</style></head><body>
  <h1>Anthony Rizk</h1>
  <div class="ask">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.7 5.3a3 3 0 0 0 1.9 1.9l5.3 1.7-5.3 1.7a3 3 0 0 0-1.9 1.9L12 21.4l-1.7-5.4a3 3 0 0 0-1.9-1.9L3.1 12.4l5.3-1.7a3 3 0 0 0 1.9-1.9z"/></svg>
    Ask my résumé anything
  </div>
  <div class="url">anthonyrizk.me</div>
</body></html>
