<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Anthony Rizk — Phone</title>
        <!-- Rough first cut: kept out of search until it's finished. -->
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#0b0b12" />
        <link rel="icon" type="image/png" href="/anthonyrizk_favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!--
          /phone — the résumé as a phone, with swappable devices.

          This page is a shell. It has no content of its own: it fetches the
          résumé (/) once and reads it into a plain data model — roles, skills,
          books, education, contact links, the Ask box's suggested questions —
          and hands that to whichever device is active. Edit the résumé and
          every device follows on the next load.

          The contract with the résumé is its class names (.exp-item, .company,
          .acq, .period, .role, .desc li, .tech, .skill-tag, .pub-item,
          .edu-item, .links a, .ask-chip). Rename those and readResume() below
          needs updating.

          Devices live in phone/<name>.js and are registered in DEVICES. Each
          exports mount(el, ctx) returning an unmount that removes everything
          it made. Only the active device's file is downloaded.

          Questions don't get answered here yet: ctx.ask() hands them to the
          résumé's Ask box via /?ask=. The Ask client lives in index.html and a
          second copy would drift; answering in place means moving it into a
          shared script first.
        -->
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            html, body { height: 100%; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
                color: #fff;
                background:
                    radial-gradient(ellipse 60% 50% at 50% 0%, #26263a, transparent 70%),
                    radial-gradient(ellipse 50% 40% at 80% 100%, #1d2a3a, transparent 70%),
                    #0b0b12;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 16px; min-height: 100vh; padding: 28px 16px;
                -webkit-font-smoothing: antialiased;
            }
            .back {
                position: fixed; top: 18px; left: 20px;
                font: 500 0.85rem Inter, system-ui, sans-serif; color: rgba(255,255,255,.62); text-decoration: none;
            }
            .back:hover { color: #fff; }
            #device { display: flex; justify-content: center; }
            .switcher { display: flex; gap: 8px; align-items: center; font: 500 12px Inter, system-ui, sans-serif; color: rgba(255,255,255,.5); }
            .switcher button {
                font: inherit; color: rgba(255,255,255,.7); background: none;
                border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 4px 12px; cursor: pointer;
            }
            .switcher button[aria-pressed="true"] { color: #fff; border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.08); }
            .caption { font-size: 0.8rem; color: rgba(255,255,255,.55); text-align: center; }
            .caption a { color: #9ec5ff; }
            .error { padding: 40px; text-align: center; }
            .error a { color: #9ec5ff; }
            /* On a real phone the page *is* the device: no frame, no chrome
               around it. Devices offer their own way to switch and leave. */
            @media (max-width: 600px) {
                body { padding: 0; gap: 0; justify-content: flex-start; }
                .back, .switcher, .caption { display: none; }
                #device { width: 100vw; height: 100vh; height: 100dvh; }
            }
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { animation: none !important; transition: none !important; }
            }
        </style>
    </head>
    <body>
        <a class="back" href="/">← résumé</a>
        <div id="device"></div>
        <div class="switcher" id="switcher" aria-label="Device"><span>Device</span></div>
        <p class="caption">The résumé, as a phone · <a href="/">back to the classic résumé</a></p>

        <script>
            (function () {
                // Bump when anything in phone/ changes: dynamic imports aren't
                // reliably refetched by a hard refresh.
                var VERSION = "2026-10-01f";
                // In order of era — the switcher lists them this way.
                var DEVICES = {
                    blackberry: { label: "BlackBerry", module: "/phone/blackberry.js" },
                    iphone4: { label: "iPhone 4", module: "/phone/iphone4.js" },
                    iphone: { label: "iPhone", module: "/phone/iphone.js" },
                };
                var DEFAULT = "iphone";

                // Real icons for the companies, keyed by the role's slug. A
                // company missing here gets a letter tile. "bg" fills behind
                // icons with transparency; full-tile icons need none. Sources:
                // each company's own apple-touch-icon or favicon, Cape's 2017
                // icon from the Wayback Machine, and Simple Icons (CC0) on the
                // brand colour where the site's own was too small to stay
                // sharp. Zeebu and Rove have none that survived.
                var ICONS = {
                    classdojo: { src: "/phone/icons/classdojo.png", bg: "#fff", pad: true },
                    greg: { src: "/phone/icons/greg.png" },
                    facebook: { src: "/phone/icons/facebook.svg", bg: "#0866ff", pad: true },
                    google: { src: "/phone/icons/google.png", bg: "#fff", pad: true },
                    cape: { src: "/phone/icons/cape.png" },
                    tableau: { src: "/phone/icons/tableau.svg", bg: "#e97627", pad: true },
                    vmware: { src: "/phone/icons/vmware.png" },
                    bitheads: { src: "/phone/icons/bitheads.png", bg: "#fff", pad: true },
                    truecontext: { src: "/phone/icons/truecontext.png" },
                };

                function text(el) { return el ? el.textContent.replace(/\s+/g, " ").trim() : ""; }
                function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, ""); }

                // ── The résumé, read once into plain data ────────────────
                function readResume(doc) {
                    var data = { roles: [], skills: [], books: [], education: [], links: {}, suggestions: [] };
                    var seen = {};
                    doc.querySelectorAll(".exp-item").forEach(function (item) {
                        var c = item.querySelector(".company");
                        var name = (c && c.firstChild ? c.firstChild.textContent : text(c)).replace(/\s+/g, " ").trim().split(/\s[—(]/)[0];
                        var period = text(item.querySelector(".period"));
                        var key = slug(name), label = name;
                        if (seen[key]) { key += period.slice(-4); label = name + " ’" + period.slice(-2); }
                        seen[key] = true;
                        data.roles.push({
                            key: key, name: name, label: label,
                            icon: ICONS[slug(name)] || null,
                            acq: text(item.querySelector(".company .acq")),
                            period: period,
                            title: text(item.querySelector(".role")),
                            bullets: Array.prototype.map.call(item.querySelectorAll(".desc li"), text),
                            tech: text(item.querySelector(".tech")).split(/\s·\s/).filter(Boolean),
                        });
                    });
                    data.skills = Array.prototype.map.call(doc.querySelectorAll(".skill-tag"), text);
                    doc.querySelectorAll(".pub-item").forEach(function (p) {
                        data.books.push({ title: text(p.querySelector(".title")), publisher: text(p.querySelector(".publisher")), year: text(p.querySelector(".pub-year")), note: text(p.querySelector(".pub-note")) });
                    });
                    doc.querySelectorAll(".edu-item").forEach(function (e) {
                        data.education.push({ school: text(e.querySelector(".company")), year: text(e.querySelector(".period")), degree: text(e.querySelector(".role")) });
                    });
                    doc.querySelectorAll(".links a").forEach(function (a) {
                        var href = a.getAttribute("href") || "";
                        if (/linkedin/i.test(href)) data.links.linkedin = href;
                        else if (/^mailto:/i.test(href)) data.links.mail = href;
                        else if (/\.pdf$/i.test(href)) data.links.pdf = href;
                    });
                    doc.querySelectorAll(".ask-chip").forEach(function (chip) {
                        data.suggestions.push(chip.dataset.question || text(chip));
                    });
                    return data;
                }

                // ── Device selection: ?device= wins for the view, a click persists ──
                function pick() {
                    try {
                        var q = new URL(location.href).searchParams.get("device");
                        if (q && DEVICES[q]) return q;
                        var s = localStorage.getItem("phone-device");
                        if (s && DEVICES[s]) return s;
                    } catch (e) {}
                    return DEFAULT;
                }

                var host = document.getElementById("device");
                var switcher = document.getElementById("switcher");
                var data = null, current = null, unmount = null, token = 0;

                function track(name) {
                    try {
                        navigator.sendBeacon("https://ask.anthonyrizk.me/event",
                            new Blob([JSON.stringify({ name: name })], { type: "text/plain" }));
                    } catch (e) {}
                }

                var ctx = {
                    get data() { return data; },
                    devices: DEVICES,
                    reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
                    esc: function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); },
                    slug: slug,
                    // A tile's face: the company's icon if we have one, else
                    // its letter on the device's own gradient.
                    face: function (a) {
                        if (a.icon) return {
                            bg: a.icon.bg || "transparent",
                            html: '<img src="' + a.icon.src + "?v=" + VERSION + '" alt="" draggable="false" style="display:block;width:100%;height:100%;object-fit:contain;' + (a.icon.pad ? "padding:14%;" : "") + '">',
                        };
                        return { bg: a.bg, html: ctx.esc(a.glyph) };
                    },
                    // Hand a question to the résumé's Ask box.
                    ask: function (q) {
                        q = (q || "").trim(); if (!q) return;
                        location.href = "/?ask=" + encodeURIComponent(q.slice(0, 500)) + "#ask";
                    },
                    setDevice: function (name, persist) { setDevice(name, persist !== false); },
                    current: function () { return current; },
                };

                function setDevice(name, persist) {
                    if (!DEVICES[name]) return;
                    if (persist) {
                        try {
                            localStorage.setItem("phone-device", name);
                            var url = new URL(location.href);
                            if (name === DEFAULT) url.searchParams.delete("device"); else url.searchParams.set("device", name);
                            history.replaceState(null, "", url);
                        } catch (e) {}
                    }
                    if (name === current) return;
                    current = name;
                    Array.prototype.forEach.call(switcher.querySelectorAll("button"), function (b) {
                        b.setAttribute("aria-pressed", b.dataset.device === name ? "true" : "false");
                    });
                    var mine = ++token;
                    if (unmount) { try { unmount(); } catch (e) { console.warn(e); } unmount = null; }
                    host.innerHTML = "";
                    import(DEVICES[name].module + "?v=" + VERSION)
                        .then(function (mod) {
                            if (mine !== token) return; // switched again while loading
                            unmount = mod.mount(host, ctx) || null;
                        })
                        .catch(function (e) {
                            console.error(e);
                            host.innerHTML = '<div class="error">That phone didn’t load.<br><br><a href="/">Open the résumé →</a></div>';
                        });
                    track("phone_" + name);
                }

                Object.keys(DEVICES).forEach(function (k) {
                    var b = document.createElement("button");
                    b.type = "button"; b.dataset.device = k; b.textContent = DEVICES[k].label;
                    b.addEventListener("click", function () { setDevice(k, true); });
                    switcher.appendChild(b);
                });

                fetch("/", { credentials: "same-origin" })
                    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
                    .then(function (html) {
                        data = readResume(new DOMParser().parseFromString(html, "text/html"));
                        setDevice(pick(), false);
                    })
                    .catch(function (e) {
                        console.error(e);
                        host.innerHTML = '<div class="error">Couldn’t load the résumé.<br><br><a href="/">Open it directly →</a></div>';
                    });
            })();
        </script>
    </body>
</html>
